<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="shared.js"></script>
    <title>獎學金系統 - 登入</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg,#667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 8px;
        }
        .login-header p {
            color: #666;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 12px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #f5f5f5;
            color: #333;
            border: 2px solid #e1e1e1;
        }
        .btn-secondary:hover {
            background: #e9e9e9;
        }
        .result {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            display: none;
        }
        .result.error {
            display: block;
            background-color: #ffe6e6;
            color: #dc3545;
            border: 1px solid #ffcccc;
        }
        .result.success {
            display: block;
            background-color: #e6ffe6;
            color: #28a745;
            border: 1px solid #ccffcc;
        }
        .divider {
            text-align: center;
            margin: 20px 0;
            color: #999;
            font-size: 14px;
        }
        .footer-text {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 13px;
        }
    </style>
    <style>
        input, select, textarea { max-width: 100%; }
        .form-row { flex-wrap: wrap; }
        table { font-size: 0.92rem; }
        @media (max-width: 700px) {
            header { flex-wrap: wrap; gap: 12px; padding: 12px !important; }
            header h2 { font-size: 20px; }
            #container { flex-direction: column; min-height: 0; }
            aside { width: 100% !important; display: flex; overflow-x: auto; padding: 10px !important; flex-shrink: 0; }
            aside a { white-space: nowrap; margin: 0 6px 0 0; padding: 8px 10px !important; }
            main { min-height: 0; flex: 1; }
            .login-container, .register-container { padding: 24px; }
            body { overflow-x: auto; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🎓 獎學金管理系統</h1>
            <p>歡迎使用獎學金申請與管理平台</p>
        </div>

        <div class="form-group">
            <label for="username">帳號</label>
            <input type="text" id="username" placeholder="請輸入您的帳號">
        </div>

        <div class="form-group">
            <label for="password">密碼</label>
            <input type="password" id="password" placeholder="請輸入您的密碼">
        </div>

        <button class="btn btn-primary" onclick="login()">登入</button>
        
        <div class="divider">— 或 —</div>
        
        <a href="register.html" style="text-decoration: none;">
            <button type="button" class="btn btn-secondary">註冊新帳號</button>
        </a>

        <div id="result" class="result"></div>

        <div style="margin-top:20px;padding:14px;background:#f4f5fb;border-radius:8px;font-size:13px;line-height:1.8;">
            <strong>快速體驗</strong> · 虛構展示帳號<br>
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;">
                <button type="button" onclick="fillDemo('01')" style="padding:6px 10px;cursor:pointer;">學生</button>
                <button type="button" onclick="fillDemo('02')" style="padding:6px 10px;cursor:pointer;">教師</button>
                <button type="button" onclick="fillDemo('03')" style="padding:6px 10px;cursor:pointer;">獎助單位</button>
                <button type="button" onclick="fillDemo('admin')" style="padding:6px 10px;cursor:pointer;">管理員</button>
            </div>
            密碼：<code>DemoPass123!</code>
        </div>
        <div class="footer-text">
            © 2025 獎學金管理系統
        </div>
    </div>

    <script>
        function fillDemo(account) { document.getElementById('username').value = account; document.getElementById('password').value = 'DemoPass123!'; }
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');

            if (!username || !password) {
                resultDiv.className = 'result error';
                resultDiv.innerText = '請輸入帳號和密碼';
                return;
            }

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.success) {
                    resultDiv.className = 'result success';
                    resultDiv.innerText = '登入成功，正在跳轉...';
                    
                    // 儲存登入資訊
                    localStorage.setItem('userId', data.user.id);
                    localStorage.setItem('username', data.user.username);
                    localStorage.setItem('role', data.user.role);

                    // 根據角色跳轉
                    setTimeout(() => {
                        switch (data.user.role) {
                            case '學生':
                                window.location.href = 'stu_index.html';
                                break;
                            case '老師':
                                window.location.href = 'teacher_index.html';
                                break;
                            case '獎助單位':
                                window.location.href = 'provider_index.html';
                                break;
                            case '管理員':
                                window.location.href = 'admin_index.html';
                                break;
                            default:
                                window.location.href = 'login.html';
                        }
                    }, 500);
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerText = data.message || '登入失敗';
                }
            } catch (e) {
                resultDiv.className = 'result error';
                resultDiv.innerText = '連線失敗，請稍後再試';
            }
        }

        // 按 Enter 鍵登入
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
