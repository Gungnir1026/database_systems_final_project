<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="shared.js"></script>
    <link rel="stylesheet" href="common.css">
    <style>
        h2 { border-color: #28a745; display: flex; align-items: center; gap: 10px; }
        h2::before { content: "📋"; }
        th { background: linear-gradient(135deg, #555555 0%, #555555 100%); }
        .badge { 
            padding: 6px 12px; 
            border-radius: 20px; 
            font-size: 0.85em; 
            font-weight: 600;
        }
        .status-pending { background-color: #fff3cd; color: #856404; }
        .status-approved { background-color: #d4edda; color: #155724; }
        .status-rejected { background-color: #f8d7da; color: #721c24; }
        select { 
            padding: 8px 12px; 
            border-radius: 8px; 
            border: 2px solid #e1e1e1;
            cursor: pointer;
        }
        select:focus { border-color: #28a745; outline: none; }
        .btn-primary { 
            background: linear-gradient(135deg, #28a745 0%, #1e7e34 100%); 
            padding: 8px 16px;
            font-size: 13px;
        }
        .btn-primary:hover { box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4); }
        .description {
            color: #666;
            margin-bottom: 20px;
            padding: 15px;
            background: linear-gradient(135deg, #e8f5e9 0%, #f0fff0 100%);
            border-radius: 8px;
            border-left: 4px solid #28a745;
        }
    </style>
    <style>
        input, select, textarea { max-width: 100%; }
        .form-row { flex-wrap: wrap; }
        table { font-size: 0.92rem; }
        @media (max-width: 700px) {
            header { flex-wrap: wrap; gap: 12px; padding: 12px !important; }
            header h2 { font-size: 20px; }
            #container { flex-direction: column; min-height: 0; }
            aside { width: 100% !important; display: flex; overflow-x: auto; padding: 10px !important; flex-shrink: 0; }
            aside a { white-space: nowrap; margin: 0 6px 0 0; padding: 8px 10px !important; }
            main { min-height: 0; flex: 1; }
            .login-container, .register-container { padding: 24px; }
            body { overflow-x: auto; }
        }
    </style>
</head>
<body>
    <h2>管理申請案件</h2>
    <p class="description">📌 以下是您單位收到的所有獎學金申請，您可以審核並更改狀態</p>
    
    <table>
        <thead>
            <tr>
                <th>申請編號</th>
                <th>學生帳號</th>
                <th>申請獎項</th>
                <th>成績/排名</th>
                <th>申請日期</th>
                <th>目前狀態</th>
                <th>更改狀態</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="applicationList">
            <tr><td colspan="8" class="empty-msg">載入中...</td></tr>
        </tbody>
    </table>

    <script>
        const userId = localStorage.getItem('userId');

        async function loadApplications() {
            try {
                const res = await fetch(`/api/provider/applications/${userId}`);
                const data = await res.json();
                const tbody = document.getElementById('applicationList');
                
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; color:#888;">目前沒有申請案件</td></tr>';
                    return;
                }

                tbody.innerHTML = data.map(app => {
                    let statusClass = '';
                    if (app.status === '待審核') statusClass = 'status-pending';
                    else if (app.status === '通過') statusClass = 'status-approved';
                    else if (app.status === '不通過') statusClass = 'status-rejected';

                    return html`
                        <tr>
                            <td>${app.application_id}</td>
                            <td>${app.user_id}</td>
                            <td>${app.scholarship_title}</td>
                            <td>${app.grade || '-'}分 / 第${app.ranking || '-'}名</td>
                            <td>${app.application_date}</td>
                            <td><span class="badge ${statusClass}">${app.status}</span></td>
                            <td>
                                <select onchange="updateStatus(${app.application_id}, this.value)">
                                    <option value="待審核" ${app.status==='待審核'?'selected':''}>待審核</option>
                                    <option value="通過" ${app.status==='通過'?'selected':''}>通過</option>
                                    <option value="不通過" ${app.status==='不通過'?'selected':''}>不通過</option>
                                </select>
                            </td>
                            <td>
                                <a href="application_data.html?app_id=${app.application_id}" class="btn btn-primary">查看詳情</a>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (e) {
                document.getElementById('applicationList').innerHTML = '<tr><td colspan="8">載入失敗</td></tr>';
            }
        }

        async function updateStatus(appId, newStatus) {
            try {
                const res = await fetch(`/api/applications/${appId}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
                if (res.ok) {
                    alert('狀態已更新');
                    loadApplications();
                }
            } catch (e) {
                alert('更新失敗');
            }
        }

        loadApplications();
    </script>
</body>
</html>
