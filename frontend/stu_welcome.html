<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="shared.js"></script>
    <link rel="stylesheet" href="common.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            min-height: 100vh;
        }
        .welcome-header {
            text-align: center;
            margin-bottom: 40px;
            padding: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            color: white;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }
        .welcome-header h1 { margin: 0 0 10px; font-size: 2.2em; }
        .welcome-header p { margin: 0; opacity: 0.9; font-size: 1.1em; }
        .announcements { max-width: 900px; margin: 0 auto; }
        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 12px;
            margin-bottom: 25px;
            color: #333;
            font-size: 1.4em;
        }
        .announcement-card {
            background: white;
            border-radius: 12px;
            padding: 20px 25px;
            margin-bottom: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            border-left: 4px solid #667eea;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .announcement-card:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }
        .announcement-card h3 { margin: 0 0 10px; color: #333; font-weight: 600; }
        .announcement-meta {
            font-size: 0.85em;
            color: #888;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .announcement-preview {
            line-height: 1.6;
            color: #555;
            max-height: 60px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .read-more {
            color: #667eea;
            font-size: 0.9em;
            margin-top: 8px;
            font-weight: 500;
        }
        .no-announcements {
            text-align: center;
            color: #888;
            padding: 60px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }
        /* Modal 樣式 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(3px);
        }
        .modal-content {
            background: white;
            margin: 5% auto;
            border-radius: 16px;
            max-width: 700px;
            max-height: 80vh;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 16px 16px 0 0;
        }
        .modal-header h3 { margin: 0; font-size: 1.3em; color: white; }
        .modal-close {
            font-size: 28px;
            cursor: pointer;
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        .modal-close:hover { opacity: 1; }
        .modal-body {
            padding: 25px;
            max-height: 60vh;
            overflow-y: auto;
        }
        .modal-meta {
            font-size: 0.9em;
            color: #888;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        .modal-text {
            line-height: 1.8;
            color: #444;
            white-space: pre-wrap;
        }
    </style>
    <style>
        input, select, textarea { max-width: 100%; }
        .form-row { flex-wrap: wrap; }
        table { font-size: 0.92rem; }
        @media (max-width: 700px) {
            header { flex-wrap: wrap; gap: 12px; padding: 12px !important; }
            header h2 { font-size: 20px; }
            #container { flex-direction: column; min-height: 0; }
            aside { width: 100% !important; display: flex; overflow-x: auto; padding: 10px !important; flex-shrink: 0; }
            aside a { white-space: nowrap; margin: 0 6px 0 0; padding: 8px 10px !important; }
            main { min-height: 0; flex: 1; }
            .login-container, .register-container { padding: 24px; }
            body { overflow-x: auto; }
        }
    </style>
</head>
<body>
    <div class="welcome-header">
        <h1>👋 歡迎回來，同學</h1>
        <p>請點擊左側選單選擇您要執行的功能</p>
    </div>

    <div class="announcements">
        <h2 class="section-title">📢 系統公告</h2>
        <div id="announcementList">
            <p>載入中...</p>
        </div>
    </div>

    <!-- 公告詳情 Modal -->
    <div id="announcementModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle"></h3>
                <span class="modal-close" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="modal-meta" id="modalMeta"></div>
                <div class="modal-text" id="modalContent"></div>
            </div>
        </div>
    </div>

    <script>
        let announcements = [];

        async function loadAnnouncements() {
            try {
                const res = await fetch('/api/announcements');
                announcements = await res.json();
                const container = document.getElementById('announcementList');
                
                if (announcements.length === 0) {
                    container.innerHTML = '<p class="no-announcements">目前沒有公告</p>';
                    return;
                }

                container.innerHTML = announcements.map((a, index) => html`
                    <div class="announcement-card" onclick="openModal(${index})">
                        <h3>${a.TITLE}</h3>
                        <div class="announcement-meta">
                            📅 ${a.announcement_date} | 發布者：${a.admin_name || '管理員'}
                        </div>
                        <div class="announcement-preview">${a.CONTENT}</div>
                        <div class="read-more">👆 點擊查看完整公告</div>
                    </div>
                `).join('');
            } catch (e) {
                document.getElementById('announcementList').innerHTML = '<p class="no-announcements">載入公告失敗</p>';
            }
        }

        function openModal(index) {
            const a = announcements[index];
            document.getElementById('modalTitle').textContent = a.TITLE;
            document.getElementById('modalMeta').innerHTML = `📅 ${a.announcement_date} | 發布者：${a.admin_name || '管理員'}`;
            document.getElementById('modalContent').textContent = a.CONTENT;
            document.getElementById('announcementModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('announcementModal').style.display = 'none';
        }

        window.onclick = function(event) {
            if (event.target == document.getElementById('announcementModal')) {
                closeModal();
            }
        }

        loadAnnouncements();
    </script>
</body>
</html>
