<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="shared.js"></script>
    <title>推薦信內容</title>
    <link rel="stylesheet" href="common.css">
    <style>
        body {
            background: linear-gradient(135deg, #f0f8f0 0%, #e0f0e0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 50px;
        }
        h2 { border-color: #28a745; display: flex; align-items: center; gap: 10px; }
        h2::before { content: "✉️"; }
        .letter-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            max-width: 700px;
            width: 100%;
            overflow: hidden;
        }
        .card-header {
            background: linear-gradient(135deg, #28a745 0%, #1e7e34 100%);
            color: white;
            padding: 20px 30px;
        }
        .card-header h3 {
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-body {
            padding: 30px;
        }
        .letter-info {
            display: flex;
            gap: 30px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e9ecef;
        }
        .letter-info-item {
            display: flex;
            flex-direction: column;
        }
        .letter-info-label {
            color: #6c757d;
            font-size: 0.85em;
            margin-bottom: 4px;
        }
        .letter-info-value {
            font-weight: 600;
            color: #333;
        }
        .letter-content {
            background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 25px;
            white-space: pre-wrap;
            line-height: 1.8;
            min-height: 200px;
            color: #333;
        }
        .card-footer {
            background: #f8f9fa;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }
        .btn-secondary {
            flex: 1;
        }
        .btn-outline {
            flex: 1;
            background: white;
            border: 2px solid #28a745;
            color: #28a745;
        }
        .btn-outline:hover {
            background: #28a745;
            color: white;
        }
        .alert {
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
    <style>
        input, select, textarea { max-width: 100%; }
        .form-row { flex-wrap: wrap; }
        table { font-size: 0.92rem; }
        @media (max-width: 700px) {
            header { flex-wrap: wrap; gap: 12px; padding: 12px !important; }
            header h2 { font-size: 20px; }
            #container { flex-direction: column; min-height: 0; }
            aside { width: 100% !important; display: flex; overflow-x: auto; padding: 10px !important; flex-shrink: 0; }
            aside a { white-space: nowrap; margin: 0 6px 0 0; padding: 8px 10px !important; }
            main { min-height: 0; flex: 1; }
            .login-container, .register-container { padding: 24px; }
            body { overflow-x: auto; }
        }
    </style>
</head>
<body>
    <div class="letter-card">
        <div class="card-header">
            <h3>✉️ 教師推薦信詳情</h3>
        </div>
        <div class="card-body" id="letterContent">
            <div style="text-align: center; color: #888; padding: 40px;">
                載入中...
            </div>
        </div>
        <div class="card-footer">
            <button onclick="history.back()" class="btn btn-secondary">← 返回申請詳情</button>
            <button onclick="window.top.location.href=({'學生':'stu_index.html','老師':'teacher_index.html','獎助單位':'provider_index.html','管理員':'admin_index.html'})[localStorage.getItem('role')] || 'login.html'" class="btn btn-outline">🏠 回管理首頁</button>
        </div>
    </div>

    <script>
        async function fetchLetter() {
            const urlParams = new URLSearchParams(window.location.search);
            const appId = urlParams.get('app_id');
            
            if (!appId) {
                document.getElementById('letterContent').innerHTML = '<div class="alert alert-danger">❌ 錯誤：未提供申請編號</div>';
                return;
            }

            try {
                const res = await fetch(`/api/recommendation/${appId}`);
                const data = await res.json();

                if (data.error) {
                    document.getElementById('letterContent').innerHTML = html`<div class="alert alert-danger">❌ ${data.error}</div>`;
                    return;
                }

                document.getElementById('letterContent').innerHTML = html`
                    <div class="letter-info">
                        <div class="letter-info-item">
                            <span class="letter-info-label">👨‍🏫 推薦教師</span>
                            <span class="letter-info-value">${data.teacher_name}</span>
                        </div>
                        <div class="letter-info-item">
                            <span class="letter-info-label">📅 提交日期</span>
                            <span class="letter-info-value">${new Date(data.submission_date).toLocaleDateString('zh-TW')}</span>
                        </div>
                    </div>
                    <div class="letter-content">${data.content}</div>
                `;
            } catch (e) {
                document.getElementById('letterContent').innerHTML = '<div class="alert alert-danger">❌ 載入失敗，請稍後再試</div>';
            }
        }
        fetchLetter();
    </script>
</body>
</html>
