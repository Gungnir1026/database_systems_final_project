<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="shared.js"></script>
    <title>申請人檔案與批閱</title>
    <link rel="stylesheet" href="common.css">
    <style>
        body {
            background: linear-gradient(135deg, #f0f8f0 0%, #e0f0e0 100%);
            min-height: 100vh;
        }
        h2 { border-color: #28a745; display: flex; align-items: center; gap: 10px; }
        h2::before { content: "📋"; }
        th { background: linear-gradient(135deg, #28a745 0%, #1e7e34 100%); }
        .profile-card { 
            background: white; 
            border-radius: 16px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); 
            padding: 30px; 
            margin-bottom: 30px; 
        }
        .section-title { 
            border-left: 4px solid #28a745; 
            padding-left: 12px; 
            margin: 20px 0 15px; 
            color: #333; 
            font-weight: 600; 
            font-size: 1.1em;
        }
        .info-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 10px;
        }
        .info-item {
            flex: 1;
            min-width: 200px;
        }
        .info-label { 
            color: #6c757d; 
            font-weight: 600; 
            margin-bottom: 4px; 
            font-size: 0.9em;
        }
        .info-value { 
            color: #212529; 
            margin-bottom: 15px; 
            border-bottom: 1px solid #eee; 
            padding-bottom: 8px; 
            font-size: 1.05rem; 
        }
        .performance-box {
            padding: 20px;
            border-radius: 12px;
            background: linear-gradient(135deg, #e8f5e9 0%, #f0fff0 100%);
            border: 1px solid #c8e6c9;
        }
        .performance-box p {
            margin: 10px 0;
        }
        .review-panel { 
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 12px; 
            padding: 25px; 
            border: 2px dashed #dee2e6; 
            margin-top: 25px;
        }
        .review-panel h5 {
            text-align: center;
            margin-bottom: 20px;
            color: #28a745;
            font-weight: 600;
        }
        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
        }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-approved { background: #d4edda; color: #155724; }
        .status-rejected { background: #f8d7da; color: #721c24; }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .content-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 30px;
        }
        @media (max-width: 768px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }
        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .radio-group label {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid #dee2e6;
            background: white;
        }
        .radio-group label:hover {
            border-color: #28a745;
        }
        .radio-group input[type="radio"] {
            margin-right: 10px;
        }
        .back-link {
            display: inline-block;
            margin-top: 15px;
            color: #6c757d;
            text-decoration: none;
        }
        .back-link:hover {
            color: #28a745;
        }
    </style>
    <style>
        input, select, textarea { max-width: 100%; }
        .form-row { flex-wrap: wrap; }
        table { font-size: 0.92rem; }
        @media (max-width: 700px) {
            header { flex-wrap: wrap; gap: 12px; padding: 12px !important; }
            header h2 { font-size: 20px; }
            #container { flex-direction: column; min-height: 0; }
            aside { width: 100% !important; display: flex; overflow-x: auto; padding: 10px !important; flex-shrink: 0; }
            aside a { white-space: nowrap; margin: 0 6px 0 0; padding: 8px 10px !important; }
            main { min-height: 0; flex: 1; }
            .login-container, .register-container { padding: 24px; }
            body { overflow-x: auto; }
        }
    </style>
</head>
<body>
    <h2>獎學金申請檔案詳情</h2>

    <div class="profile-card">
        <div class="header-row">
            <span style="font-size: 1.1em; font-weight: 600;">📄 申請案件資訊</span>
            <div>
                <span style="color: #888; margin-right: 10px;">目前狀態:</span>
                <span id="statusBadge" class="status-badge">載入中...</span>
            </div>
        </div>

        <div class="content-grid">
            <div class="left-section">
                <h5 class="section-title">👤 基本與學術資訊</h5>
                <div class="info-row">
                    <div class="info-item">
                        <p class="info-label">學生姓名</p>
                        <div id="student_name" class="info-value">--</div>
                        <p class="info-label">學號</p>
                        <div id="student_number" class="info-value">--</div>
                    </div>
                    <div class="info-item">
                        <p class="info-label">系級</p>
                        <div id="department_year" class="info-value">--</div>
                        <p class="info-label">電子郵件</p>
                        <div id="email" class="info-value">--</div>
                    </div>
                </div>

                <h5 class="section-title">🏦 銀行帳戶資訊</h5>
                <div class="info-row">
                    <div class="info-item">
                        <p class="info-label">銀行帳號</p>
                        <div id="bank_account" class="info-value">--</div>
                    </div>
                    <div class="info-item">
                        <p class="info-label">分行/代碼</p>
                        <div id="bank_serial" class="info-value">--</div>
                    </div>
                </div>

                <h5 class="section-title">📊 申請表現</h5>
                <div class="performance-box">
                    <p><strong>🏆 申請項目：</strong> <span id="scholarship_title">--</span></p>
                    <p><strong>📈 學業成績：</strong> <span id="grade" style="color: #dc3545; font-weight: bold;">--</span></p>
                    <p><strong>🥇 班級排名：</strong> <span id="ranking">--</span></p>
                </div>
                
                <div style="margin-top: 20px;">
                    <a id="btn_recommendation" href="#" class="btn btn-info" style="width: 100%;">✉️ 查看指導老師推薦信</a>
                </div>
            </div>

            <div class="right-section">
                <div class="review-panel">
                    <h5>⚖️ 審核決策面板</h5>
                    <hr style="border-color: #dee2e6;">
                    <form id="reviewForm">
                        <div class="radio-group">
                            <label>
                                <input type="radio" name="status" id="status_pending" value="待審核">
                                <span>⏳ 保持待審核</span>
                            </label>
                            <label>
                                <input type="radio" name="status" id="status_pass" value="通過">
                                <span>✅ 通過申請</span>
                            </label>
                            <label>
                                <input type="radio" name="status" id="status_fail" value="不通過">
                                <span>❌ 不通過申請</span>
                            </label>
                        </div>
                        <button type="submit" class="btn btn-success" style="width: 100%;">💾 儲存審核結果</button>
                    </form>
                    <div id="reviewResult" class="result" style="margin-top: 15px;"></div>
                    <a href="javascript:history.back()" class="back-link">← 返回列表</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentAppId = new URLSearchParams(window.location.search).get('app_id');

        document.addEventListener('DOMContentLoaded', fetchFullDetail);

        async function fetchFullDetail() {
            if (!currentAppId) return alert("缺少編號");

            const res = await fetch(`/api/application-full-detail/${currentAppId}`);
            const data = await res.json();

            // 填充資料
            document.getElementById('student_name').innerText = data.username;
            document.getElementById('student_number').innerText = data.student_number;
            document.getElementById('department_year').innerText = `${data.department} / ${data.academic_year}年級`;
            document.getElementById('email').innerText = data.email;
            document.getElementById('bank_account').innerText = data.bank_account;
            document.getElementById('bank_serial').innerText = data.bank_serial_number;
            document.getElementById('scholarship_title').innerText = data.scholarship_title;
            document.getElementById('grade').innerText = data.grade + " 分";
            document.getElementById('ranking').innerText = "第 " + data.ranking + " 名";

            // 更新狀態標籤
            const badge = document.getElementById('statusBadge');
            badge.innerText = data.status;
            if (data.status === '通過') {
                badge.className = 'status-badge status-approved';
            } else if (data.status === '不通過') {
                badge.className = 'status-badge status-rejected';
            } else {
                badge.className = 'status-badge status-pending';
            }

            // 預選 Radio Button
            if(data.status === '通過') document.getElementById('status_pass').checked = true;
            else if(data.status === '不通過') document.getElementById('status_fail').checked = true;
            else document.getElementById('status_pending').checked = true;

            // 推薦信連結
            document.getElementById('btn_recommendation').href = `recommendation_letter.html?app_id=${currentAppId}`;
        }

        // 處理批閱提交
        document.getElementById('reviewForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const selectedStatus = document.querySelector('input[name="status"]:checked').value;
            const resultDiv = document.getElementById('reviewResult');

            const res = await fetch(`/api/applications/${currentAppId}/status`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: selectedStatus })
            });

            if (res.ok) {
                resultDiv.className = 'result success';
                resultDiv.innerText = '✅ 批閱完成！狀態已更新為：' + selectedStatus;
                fetchFullDetail(); // 刷新頁面數據
            } else {
                resultDiv.className = 'result error';
                resultDiv.innerText = '❌ 更新失敗，請稍後再試';
            }
        });
    </script>
</body>
</html>
